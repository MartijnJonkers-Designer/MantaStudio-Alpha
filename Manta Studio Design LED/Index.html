<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020611" />
  <title>Auros — Liquid Engine</title>
  <meta name="description" content="Auros: a liquid rendering engine." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="Styles.css" />

  <!-- v0.6 brand palette: WE MOVE in gold, THE DEEP in silver,
       both on the deep midnight navy ground. mix-blend-mode dropped
       — against this palette it produced black holes (gold-on-gold)
       and muddy blues (silver-on-gold) instead of luxury contrast.
       The headline now stacks the two lines vertically via
       flex-direction: column on the parent. -->
  <style>
    .headline {
      flex-direction: column;
    }
    .headline > span {
      display: block;
    }
    .headline__gold   { color: #D4AF37; }
    .headline__silver { color: #C0C0C0; }
  </style>

  <!-- Import map: "three" + addons namespace, both pinned to 0.170.0. -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <canvas id="auros-canvas" class="canvas" aria-hidden="true"></canvas>

  <h1 class="headline">
    <span class="headline__gold">WE MOVE</span>
    <span class="headline__silver">THE DEEP</span>
  </h1>

  <script type="module" src="main.js"></script>
</body>
</html>
