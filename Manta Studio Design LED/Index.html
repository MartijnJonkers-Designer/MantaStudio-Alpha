<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080A0F" />
  <title>Auros — Liquid Engine</title>
  <meta name="description" content="Auros: a liquid rendering engine." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="Styles.css" />

  <!-- v0.5 deep glass:
       Pure white text with mix-blend-mode: difference.
         over #080A0F bg     →  ~white
         over #A5B4FC peaks  →  muted dark olive (90, 75, 3)
       The blend produces gentle warm flares where peaks pass through
       the letters — much subtler than v0.4's cyan inversion. -->
  <style>
    .headline {
      color: #FFFFFF;
      mix-blend-mode: difference;
    }
  </style>

  <!-- Import map: "three" + addons namespace, both pinned to 0.170.0. -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <canvas id="auros-canvas" class="canvas" aria-hidden="true"></canvas>

  <h1 class="headline">WE MOVE THE DEEP</h1>

  <script type="module" src="main.js"></script>
</body>
</html>
