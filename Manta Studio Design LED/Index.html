<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Auros — Liquid Engine</title>
  <meta name="description" content="Auros: a liquid rendering engine." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="Styles.css" />

  <!-- v0.2: headline blends against the liquid surface via difference,
       so the shader's bright highlights invert the letterforms they
       pass through. White text + per-channel subtraction = liquid
       warping through the type. -->
  <style>
    .headline { mix-blend-mode: difference; }
  </style>

  <!-- Import map: lets main.js import "three" as a bare specifier
       (resolves to the CDN URL below). 2026-standard ESM approach;
       pinning lives here so version bumps stay in one place. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>

  <!-- Three.js render target. Sits behind the headline (z-index 0). -->
  <canvas id="auros-canvas" class="canvas" aria-hidden="true"></canvas>

  <!-- Headline overlay. Z-index 1, pointer-events disabled, blended with difference. -->
  <h1 class="headline">WE MOVE THE DEEP</h1>

  <!-- main.js is an ES module — Three.js resolved via the importmap above. -->
  <script type="module" src="main.js"></script>
</body>
</html>
