<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F0F0F0" />
  <title>MantaWorks — Ethereal Ice</title>
  <meta name="description" content="MantaWorks. Ethereal Ice hero." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============================================================
       AUROS v0.27 — Ethereal Ice (single-file styles)

       Light grey ground, full-viewport WebGL canvas behind four
       corner HUDs and one center CTA. Canvas captures no pointer
       events so HUD/CTA receive clicks naturally.
       ============================================================ */

    :root {
      --bg:        #F0F0F0;   /* light grey ground */
      --ink-dark:  #1C1C1E;   /* near-black */
      --cyan:      #00FFFF;   /* Arctic Blue accent */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink-dark);
      overflow: hidden;
      font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
      pointer-events: none;     /* HUD + CTA receive clicks */
    }

    /* HUD — four corner readouts, 10px monospace, near-black at 0.7 opacity */
    .hud {
      position: fixed;
      z-index: 10;
      font-family: "Geist Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--ink-dark);
      opacity: 0.7;
      pointer-events: none;
      white-space: nowrap;
    }
    .hud--tl { top: 24px;    left: 24px;  }
    .hud--tr { top: 24px;    right: 24px; }
    .hud--bl { bottom: 24px; left: 24px;  }
    .hud--br { bottom: 24px; right: 24px; }

    /* CTA — matte-black button with silver border, magnetic mouse follow */
    .cta {
      position: fixed;
      bottom: 64px;
      left: 50%;
      z-index: 10;
      background: var(--ink-dark);
      color: #FFFFFF;
      font-family: "Geist Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.22em;
      padding: 16px 32px;
      border: 1px solid #C0C0C0;
      border-radius: 2px;
      cursor: pointer;
      transform: translate(-50%, 0);
      transition: transform 0.18s cubic-bezier(.16, 1, .3, 1),
                  background 0.20s ease,
                  box-shadow 0.20s ease;
      will-change: transform;
    }
    .cta:hover {
      background: #000000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    .cta:active {
      transform: translate(-50%, 1px) scale(0.98);
    }

    /* v1.16 — hero shot: hide all overlay text */
    .hud, .cta { display: none !important; }

    /* v1.16 — subtle vignette overlay so corners sit slightly cooler than center */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 255, 255, 0)    35%,
        rgba(220, 222, 232, 0.18) 75%,
        rgba(200, 205, 220, 0.32) 100%
      );
    }
  </style>

  <!-- All Three.js imports via CDN. main.js uses bare specifiers like
       `import * as THREE from "three"` which the importmap resolves. -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <canvas id="auros-canvas" class="canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- HUD: four corner readouts, 10px Geist Mono, color #1C1C1E at 0.7 opacity -->
  <div class="hud hud--tl" aria-hidden="true">MANTAWORKS // REF: ALPHA_V4</div>
  <div class="hud hud--tr" aria-hidden="true">SYSTEM_STATUS: NOMINAL</div>
  <div class="hud hud--bl" aria-hidden="true">ENCRYPTION: ACTIVE</div>
  <div class="hud hud--br" aria-hidden="true">COORDINATES: [24.52, 72.83]</div>

  <!-- CTA: matte-black button bottom-center, magnetic mouse follow within 100px -->
  <button class="cta" id="cta">REQUEST BRIEFING</button>

  <script type="module" src="main.js"></script>
</body>
</html>
