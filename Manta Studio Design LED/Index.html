<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#010816" />
  <title>Auros — Liquid Engine</title>
  <meta name="description" content="Auros: a liquid rendering engine." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="Styles.css" />

  <!-- v0.3 bioluminescence: crisp off-white text on top of the liquid.
       mix-blend-mode was dropped — against navy + mint, the difference
       blend produced cream and burgundy instead of "crisp #E0E0E0".
       The halo now comes from the bloom around the bright mint peaks,
       not from blend-mode math. -->
  <style>
    .headline {
      color: #E0E0E0;
    }
  </style>

  <!-- Import map: "three" + the addons namespace for postprocessing modules.
       Both pinned to the same Three.js version so EffectComposer / passes
       share the core's internals. -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Three.js render target. Sits behind the headline (z-index 0). -->
  <canvas id="auros-canvas" class="canvas" aria-hidden="true"></canvas>

  <!-- Headline overlay. Z-index 1, pointer-events disabled. -->
  <h1 class="headline">WE MOVE THE DEEP</h1>

  <!-- main.js is an ES module — Three.js + addons resolved via the importmap above. -->
  <script type="module" src="main.js"></script>
</body>
</html>
